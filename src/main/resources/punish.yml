# ============================================================
#  星落平原 —— 处罚系统配置（punish.yml）
# ============================================================
#  功能：警告 / 踢出 / 定时封禁 / 定时禁言，以及查询与解除。
#  数据存于独立的 data/punish.db（SQLite），与传送数据完全隔离；旧版根目录文件会自动迁移。
#
#  命令一览（权限节点见 paper-plugin.yml 的 permissions 段）：
#    /sfpcheck  <处罚ID 或 玩家名>   查询处罚记录
#    /sfpwarn   <在线玩家> <原因>     警告
#    /sfpkick   <在线玩家> <原因>     踢出
#    /sfpban    <玩家> <时间> <原因>   封禁（可对离线玩家）
#    /sfpmute   <玩家> <时间> <原因>   禁言（可对离线玩家）
#    /sfpunban  <玩家名>              解除封禁（目标取自数据库已封禁名单）
#    /sfpunmute <玩家名>              解除禁言（目标取自数据库已禁言名单）
#
#  时间写法：7d=7天 / 12h / 1d2h30m / 90s / perm=永久
# ============================================================

enabled: true

# ------------------------------------------------------------
#  数据库（独立文件，不与其他功能共用）
# ------------------------------------------------------------
database:
  # 数据库文件位置，支持三种写法：
  #   1. 文件名     punish.db                 → plugins/SFP-main/data/punish.db（默认）
  #      旧版 plugins/SFP-main/punish.db 会在首次启动时自动迁移。
  #   2. 相对路径   data/punish.db            → plugins/SFP-main/data/punish.db
  #   3. 绝对路径   D:/mc/shared/punish.db    → 直接用该文件
  # 绝对路径可用于把数据放到插件目录之外（挂载盘、跨服共享目录），
  # 或接入现有的处罚库。父目录不存在会自动创建。
  #
  # ⚠ 接入已有数据库时，该库必须已有本插件要求的表结构
  #   （players / punishments / punishment_logs 三张表，可先用 /sfp test 校验）。
  #   别家插件（LiteBans、AdvancedBan 等）的表结构不同，无法直接读取，
  #   需先用外部工具转换。结构不符时插件不会改动原库，只在日志中提示。
  file: 'punish.db'
  # 是否自动提交：true 简单省心；改成 false 则按批提交（本插件每次操作都会 commit）
  auto-commit: true

# ------------------------------------------------------------
#  通用
# ------------------------------------------------------------
# 处罚原因留空时使用的默认原因
default-reason: '违反服务器规则'
# 「永久」的展示文本（占位符 {expire} / {duration} 会用它）
permanent-text: '永久'

# ------------------------------------------------------------
#  踢出延迟（tick，20 tick = 1 秒）
# ------------------------------------------------------------
# 踢出玩家前先等待这么多 tick 再真正断开连接。**跨服（Velocity / BungeeCord）环境必须 ≥ 1**。
#
# 原因：玩家被踢的那个瞬间若「还没在某个子服站稳」，代理会把它当成一次连接中断，
# 转而把玩家重新投递到 velocity.toml 里 try 列表的下一个子服（例如从 vanilla 转投 lobby）。
# 此时客户端还没收到「开始加载区块」的包，就会一直卡在「加载地形中」，
# 而服务端侧看到的却是「玩家已断开」—— 也就是「玩家卡住、服务端已断开」的现象。
# 延后一 tick，让本次登录先在子服走完，代理就会按正常踢出处理：直接断开并显示踢出原因。
#
# 单机（无代理）环境保持 1 即可，设为 1 与「立即踢」在观感上无差别。
kick-delay-ticks: 1

# ------------------------------------------------------------
#  音效（执行处罚 / 解除时播放给操作者；留空即静音）
#  支持枚举名（ENTITY_VILLAGER_NO）或注册名（minecraft:entity.villager.no）
#    punish —— warn / kick / ban / mute 成功后播放
#    revoke —— unban / unmute 成功后播放
# ------------------------------------------------------------
sounds:
  punish: 'ENTITY_VILLAGER_NO'
  revoke: 'BLOCK_ANVIL_LAND'

# ------------------------------------------------------------
#  面向玩家的文案（MiniMessage 语法）
#  可用占位符：{player} {operator} {reason} {type} {id} {expire} {duration}
#    {expire}   剩余多久
#    {duration} 本条处罚原本的时长
#  注意：{reason} 会原样解析 MiniMessage —— 所以处罚原因里可以直接写颜色标签。
#  命令执行后的简短反馈在 messages.yml 的 punish.*（不在这里）。
# ------------------------------------------------------------
messages:
  # 被禁言者发言时收到的提示
  mute-notice: |-
    <red>你已被禁言</red>
    <gray>原因：</gray><white>{reason}</white>
    <gray>剩余时间：</gray><white>{expire}</white>

  # 被封禁者尝试登录时看到的整屏文字（踢下线）
  kick-screen-ban: |-
    <dark_red><bold>你已被封禁</bold></dark_red>

    <gray>处罚编号：</gray><white>{id}</white>
    <gray>原因：</gray><white>{reason}</white>
    <gray>剩余时间：</gray><white>{expire}</white>
    <gray>操作者：</gray><white>{operator}</white>

    <dark_gray>如有疑问，请联系服主申诉。</dark_gray>

  # 被 /sfpkick 踢出时看到的整屏文字
  kick-screen-kick: |-
    <red><bold>你已被移出服务器</bold></red>

    <gray>处罚编号：</gray><white>{id}</white>
    <gray>原因：</gray><white>{reason}</white>
    <gray>操作者：</gray><white>{operator}</white>

# ------------------------------------------------------------
#  全服广播：执行封禁 / 禁言时是否公告，以及公告格式
# ------------------------------------------------------------
broadcast:
  enabled: true
  format: '<gray>[</gray><red>处罚</red><gray>]</gray> <white>{player}</white> <gray>被</gray><yellow>{operator}</yellow><gray>执行</gray><red>{type}</red><gray>（</gray><white>{duration}</white><gray>）</gray><gray>，原因：</gray><white>{reason}</white>'
