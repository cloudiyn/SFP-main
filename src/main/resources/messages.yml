# ==========================================================
# 面向玩家的文案（messages.yml）
# ----------------------------------------------------------
# 1) 同时支持 MiniMessage 标签（<red>、<gradient:...>）与传统色码（&a、§a）。
# 2) 可用占位符（花括号）：{player} {count} {time} {page} {pages} {total}
#    {name} {desc} {icon} 等，按具体消息说明使用。
# 3) 删除某条即可回退到插件内置默认文案。
# 4) 多行消息请使用列表形式（以 - 开头，每行一条）。
# ==========================================================

# ---------- 通用 ----------
common:
  no-permission: "<red>你没有权限使用此命令！</red>"
  player-only: "<red>该命令只能由玩家执行。</red>"
  feature-disabled: "<red>该功能当前未启用。</red>"
  reload-success: "<green>[星落平原] 配置已重载。</green>"
  reload-failed: "<red>[星落平原] 重载失败。</red>"
  unknown-subcommand: "<red>未知子命令，输入 /sfp 查看用法。</red>"
  # 子界面（垃圾桶 / 家列表 / 传送点列表）导航行里的返回按钮
  back-to-menu: "<!i><yellow>返回主菜单</yellow>"

# ---------- 扫地（clean 包）----------
clean:
  # 清扫前提醒，{seconds} 为剩余秒数
  reminder: "<!i><yellow>[扫地] 还有 {seconds} 秒将清扫地面掉落物，请及时拾取！</yellow>"
  # 清扫完成广播
  result: "<!i><green>[扫地] 已清扫 {count} 个掉落物并收入垃圾桶。</green> <yellow>请在下次清扫前打开垃圾桶取回重要物品！</yellow> <gray>下次清扫将在 {time} 后。</gray>"
  result-button: "<!i><yellow><click:run_command:'/trashbin'>[打开垃圾桶]</click></yellow>"
  # 不进入垃圾桶、直接删除时的提示
  result-deleted: "<!i><green>[扫地] 已清理 {count} 个掉落物。</green> <gray>下次清扫将在 {time} 后。</gray>"
  result-button-hover: "<!i><gray>点击打开垃圾桶取回物品</gray>"

# ---------- 垃圾桶（trashbin 包）----------
trashbin:
  title: "<!i><dark_gray>垃圾桶</dark_gray> <gray>- 第 {page}/{pages} 页</gray>"
  prev: "<!i><yellow>上一页</yellow>"
  next: "<!i><yellow>下一页</yellow>"
  first: "<!i><dark_gray>首页</dark_gray>"
  last: "<!i><dark_gray>末页</dark_gray>"
  info-name: "<!i><aqua>垃圾桶信息</aqua>"
  info-lore:
    - "<!i><gray>当前页： <white>{page}/{pages}</white></gray>"
    - "<!i><gray>物品总数： <white>{total}</white></gray>"
    - "<!i><gray>点击物品即可取回</gray>"
  taken: "<green>已从垃圾桶取回物品。</green>"
  disabled: "<red>垃圾桶系统未启用。</red>"

# ---------- 椅子（chair 包）----------
chair:
  sit: "<green>你坐下了。潜行或再次右键座位可以站起来。</green>"
  occupied: "<yellow>这个座位已经有人了！</yellow>"

# ---------- 传送通用（teleport 包）----------
teleport:
  storage-error: "<red>传送数据库不可用，请联系管理员。</red>"
  world-missing: "<red>目标世界不存在或已被卸载。</red>"
  failed: "<red>传送失败。</red>"
  # {seconds} 剩余冷却秒数
  cooldown: "<red>传送冷却中，请等待 {seconds} 秒。</red>"
  # {seconds} 延迟传送等待秒数（teleport.delay-seconds > 0 时）
  delayed: "<yellow>将在 {seconds} 秒后传送，移动将打断。</yellow>"
  # 等待期间 ActionBar 上的倒计时；{time} 为剩余秒数（精确到 0.5 秒，如「2.5」）
  actionbar: "<yellow>剩余 <white>{time}</white> 秒</yellow>"
  cancelled: "<red>传送已取消（位置发生变化）。</red>"
  cancelled-damage: "<red>传送已取消（你受到了伤害）。</red>"
  prev: "<!i><yellow>上一页</yellow>"
  next: "<!i><yellow>下一页</yellow>"
  first: "<!i><dark_gray>首页</dark_gray>"
  last: "<!i><dark_gray>末页</dark_gray>"

# ---------- 随机传送（/rtp）----------
rtp:
  # 开始寻找落点（选点涉及区块加载，可能需要一点时间）
  searching: "<yellow>正在为你寻找合适的随机传送点……</yellow>"
  # 已有一次选点在进行中
  in-progress: "<yellow>正在为你寻找合适的随机传送点，请稍候……</yellow>"
  # 找到并完成传送；{location} 目标坐标
  success: "<green>已随机传送到（{location}）。</green>"
  # {time} 剩余冷却（x分x秒）
  cooldown: "<red>随机传送冷却中，请等待 {time}。</red>"
  # {world} 当前世界名
  world-not-allowed: "<red>当前世界（{world}）不允许随机传送。</red>"
  # 多次尝试仍未找到安全落点
  failed: "<red>没有找到合适的随机传送点，请稍后再试。</red>"

# ---------- 返回（/back）----------
back:
  # {location} 目标坐标
  success: "<green>已返回上一位置（{location}）。</green>"
  no-location: "<red>没有可返回的位置。</red>"

# ---------- 个人家（/home）----------
home:
  title: "<!i><aqua>我的家</aqua> <gray>- 第 {page}/{pages} 页</gray>"
  info-name: "<!i><aqua>家列表信息</aqua>"
  info-lore:
    - "<!i><gray>当前页： <white>{page}/{pages}</white></gray>"
    - "<!i><gray>家总数： <white>{total}</white></gray>"
    - "<!i><gray>左键传送 / 右键删除</gray>"
  # {name} 家名；{location} 坐标
  set-success: "<green>已设置家「{name}」（{location}）。</green>"
  set-cooldown: "<red>设置家冷却中，请等待 {seconds} 秒。</red>"
  del-success: "<green>已删除家「{name}」。</green>"
  teleport-success: "<green>已传送到家「{name}」。</green>"
  not-found: "<red>不存在名为「{name}」的家。</red>"
  none: "<yellow>你还没有设置任何家。</yellow>"
  invalid-name: "<red>家名只能包含中文、字母、数字、下划线，长度 1~16。</red>"
  limit-reached: "<red>你的家数量已达上限（{max} 个），请先删除一些。</red>"
  usage-delhome: "<red>用法：/delhome <名称></red>"
  list-header: "<aqua>你的家（{count}）：</aqua>"
  list-entry: "<gray> - </gray><white>{name}</white> <dark_gray>({location})</dark_gray>"

# ---------- 公共传送点（/warp）----------
warp:
  title: "<!i><light_purple>传送点</light_purple> <gray>- 第 {page}/{pages} 页</gray>"
  info-name: "<!i><light_purple>传送点信息</light_purple>"
  info-lore:
    - "<!i><gray>当前页： <white>{page}/{pages}</white></gray>"
    - "<!i><gray>传送点总数： <white>{total}</white></gray>"
    - "<!i><gray>公共传送点，仅管理员可删除</gray>"
  set-success: "<green>已创建传送点「{name}」（{location}）。</green>"
  del-success: "<green>已删除传送点「{name}」。</green>"
  teleport-success: "<green>已传送到「{name}」。</green>"
  not-found: "<red>不存在名为「{name}」的传送点。</red>"
  none: "<yellow>当前没有任何传送点。</yellow>"
  invalid-name: "<red>传送点名只能包含中文、字母、数字、下划线，长度 1~16。</red>"
  usage-setwarp: "<red>用法：/setwarp <名称></red>"
  usage-delwarp: "<red>用法：/delwarp <名称></red>"
  list-header: "<aqua>传送点（{count}）：</aqua>"
  list-entry: "<gray> - </gray><white>{name}</white> <dark_gray>({location})</dark_gray>"

# ---------- 玩家间传送请求（/tpa /tpahere）----------
# 收到请求时会同时发两样东西：
#   ① 原生弹窗界面（带「接受 / 拒绝」按钮）——用 tpa.dialog-* 的文案
#   ② 聊天里的可点击按钮 + 手动输入提示——用 tpa.tui-* 的文案
# 两条通道最终都执行 /tpaccept、/tpdeny，行为一致；tui 那套是客户端弹窗不生效时的兜底。
tpa:
  # 弹窗界面
  dialog-title: "<!i><gold>传送请求</gold>"
  dialog-accept: "<!i><green>接受</green>"
  dialog-deny: "<!i><red>拒绝</red>"
  dialog-accept-hover: "<!i><gray>同意这次传送</gray>"
  dialog-deny-hover: "<!i><gray>拒绝这次传送</gray>"
  # 聊天 TUI（同一条消息里的按钮）
  # 注意：点击命令由代码挂载（TpaManager#sendChatUi），**不要**在这里再写 <click:...>，
  # 否则会出现「配置里的命令模板」与「代码挂的命令」两份，容易误以为占位符没被替换。
  tui-accept: "<!i><green>[接受]</green>"
  tui-deny: "<!i><red>[拒绝]</red>"
  # 回应界面里的「切换界面形式」按钮（偏好存 settings.db，切换后立即用新形式重发当前请求）
  dialog-switch: "<!i><yellow>切换界面</yellow>"
  dialog-switch-hover: "<!i><gray>改用聊天里的按钮来回应</gray>"
  tui-switch: "<!i><yellow>[切换为弹窗]</yellow>"
  tui-switch-hover: "<!i><gray>改用弹窗来回应</gray>"
  ui-switched: "<green>传送请求的回应界面已切换为：{mode}。</green>"
  tui-tip: "<!i><dark_gray>（上面的按钮点不动时，手动输入：/tpaccept {from} 或 /tpdeny {from}）</dark_gray>"
  # 请求正文：{from} 为发起者名字
  request-to: "<!i><yellow>{from}</yellow> <gray>请求传送到你身边</gray>"
  request-here: "<!i><yellow>{from}</yellow> <gray>请求把你传送到TA身边</gray>"
  # 发起者回执
  sent-to: "<green>已请求传送到 {target} 身边，等待对方响应（{seconds} 秒内有效）。</green>"
  sent-here: "<green>已请求让 {target} 传送到你身边，等待对方响应（{seconds} 秒内有效）。</green>"
  # 结果提示
  accepted-target: "<green>已接受 {from} 的传送请求。</green>"
  accepted-from: "<green>{target} 接受了你的请求，正在传送……</green>"
  denied-target: "<gray>已拒绝 {from} 的传送请求。</gray>"
  denied-from: "<red>{target} 拒绝了你的传送请求。</red>"
  expired-from: "<red>你发给 {target} 的传送请求已过期。</red>"
  expired-target: "<gray>{from} 的传送请求已过期。</gray>"
  from-offline: "<gray>{from} 已离线，传送请求已取消。</gray>"
  # 异常与用法
  no-request: "<red>没有待处理的传送请求（可能已被处理或已过期）。</red>"
  not-found: "<red>没有来自「{name}」的待处理请求。</red>"
  target-offline: "<red>玩家「{name}」不在线。</red>"
  no-targets: "<yellow>当前没有其他在线玩家。</yellow>"
  offline: "<red>对方已离线，请求已取消。</red>"
  self: "<red>不能向自己发起传送请求。</red>"
  replaced: "<red>你发给 {target} 的传送请求已被新的请求取代。</red>"
  cooldown: "<red>传送请求冷却中，请等待 {seconds} 秒。</red>"
  usage-tpa: "<red>用法：/tpa <玩家名> —— 请求传送到对方身边。</red>"
  usage-tpahere: "<red>用法：/tpahere <玩家名> —— 请求对方传送到你身边。</red>"
  # 菜单里的「选择传送目标」界面
  gui-title: "<!i><aqua>选择传送目标</aqua> <gray>- 第 {page}/{pages} 页</gray>"
  gui-info-name: "<!i><aqua>玩家传送</aqua>"
  gui-info-lore:
    - "<!i><gray>在线玩家： <white>{total}</white></gray>"
    - "<!i><gray>当前页： <white>{page}/{pages}</white></gray>"
    - "<!i><gray>左键 = 我去他那，右键 = 他来我这</gray>"
  gui-entry-lore:
    - "<!i><gray>所在世界： <white>{world}</white></gray>"
    - "<!i><green>左键</green><gray> 请求传送到他身边</gray>"
    - "<!i><red>右键</red><gray> 请求他传送到你身边</gray>"

# ---------- 假人（/bot）----------
bot:
  created: "<green>已创建假人「{name}」（{location}），它会保持所在区块加载。</green>"
  removed: "<green>已移除假人「{name}」。</green>"
  removed-all: "<green>已移除全部假人（{count} 个）。</green>"
  not-found: "<red>不存在名为「{name}」的假人。</red>"
  exists: "<red>已存在名为「{name}」的假人。</red>"
  invalid-name: "<red>假人名字只能包含字母、数字、下划线，长度 1~{max}。</red>"
  limit-reached: "<red>你创建的假人已达上限（{max} 个），可先用 /bot remove 删掉一些。</red>"
  create-failed: "<red>创建假人失败：{error}</red>"
  world-not-found: "<red>找不到世界「{world}」。</red>"
  bad-coords: "<red>坐标格式不正确，应为数字。</red>"
  # 只给了世界或坐标的一部分时（既不是「只有名字」也不是「名字 + 世界 + x y z」）
  usage-coords: "<red>坐标要么不写，要么写全：/bot create <名字> <世界> <x> <y> <z></red>"
  need-coords: "<red>控制台执行时必须给出坐标：/bot create <名字> <世界> <x> <y> <z></red>"
  list-header: "<aqua>假人（{count}）：</aqua>"
  list-empty: "<yellow>当前没有假人。</yellow>"
  list-entry: "<gray> - </gray><white>{name}</white> <dark_gray>({world} {x}, {y}, {z}) {state}</dark_gray>"

# ---------- 界面样式切换（/menuui）----------
menuui:
  current: "<gray>当前界面样式：<white>{mode}</white>。切换：/menuui dialogui 或 /menuui box</gray>"
  usage: "<red>用法：/menuui dialogui 或 /menuui box</red>"
  toggled-dialog: "<green>界面已切换为 dialogUI（弹窗界面），下次打开菜单生效。</green>"
  toggled-box: "<green>界面已切换为箱子界面，下次打开菜单生效。</green>"

# ---------- 菜单（menu 包）----------
menu:
  head-name: "<!i><yellow>{player}</yellow>"
  # 鞘翅兑换（2.10.2：支持「钻石 或 下界残骸」二选一）
  # {cost_need} 本次兑换的要求（如「64 个钻石 或 8 个下界残骸」）
  # {cost_text} 本次实际扣除的材料描述（如「64 个钻石」）
  # {diamond} {debris} 各自所需数量；{diamond_have} {debris_have} 玩家各自持有量
  elytra-success: "<green>兑换成功！已消耗 <white>{cost_text}</white><green>，获得 1 个鞘翅。</green>"
  elytra-not-enough: "<red>材料不足：兑换一个鞘翅需要 </red><white>{cost_need}</white><red>。</red> <gray>（钻石 </gray><white>{diamond_have}</white><gray>/</gray><white>{diamond}</white><gray>，残骸 </gray><white>{debris_have}</white><gray>/</gray><white>{debris}</white><gray>）</gray>"
  # 管理员把两种材料都配成 0 时点按钮的提示
  elytra-misconfigured: "<red>鞘翅兑换当前不可用，请联系管理员。</red>"

# ---------- dialogUI（Paper 弹窗界面）----------
# 主菜单弹窗的按钮文案取自 menu.yml 的 buttons.*；这里放列表类弹窗（家 / 传送点 / 选人）的文案。
# 列表标题复用 home.title / warp.title / tpa.gui-title（含 {page} {pages} 占位符），
# 翻页按钮复用 teleport.prev / next / first / last，返回按钮复用 common.back-to-menu。
dialogui:
  # 条目的显示名与悬浮提示
  entry-name: "<white>{name}</white>"
  entry-hover-location: "<gray>{location}</gray>"
  # 家列表：点条目后弹出的「传送 / 删除」选择框
  home-action-title: "<!i><aqua>我的家</aqua>"
  home-action-body: "<!i><yellow>{name}</yellow> <gray>—— 选择操作</gray>"
  home-teleport: "<!i><green>传送</green>"
  home-teleport-hover: "<!i><gray>传送到这个家</gray>"
  home-delete: "<!i><red>删除这个家</red>"
  home-delete-hover: "<!i><gray>等同 /delhome {name}</gray>"
  # 选择传送目标：点玩家后弹出的「传送方向」选择框
  tpa-entry-hover: "<gray>{world}</gray>"
  tpa-direction-title: "<!i><aqua>玩家传送</aqua>"
  tpa-direction-body: "<!i><yellow>{name}</yellow> <gray>—— 选择传送方向</gray>"
  tpa-to: "<!i><green>传送到他身边</green>"
  tpa-to-hover: "<!i><gray>等同 /tpa {name}</gray>"
  tpa-here: "<!i><aqua>让他传送到你身边</aqua>"
  tpa-here-hover: "<!i><gray>等同 /tpahere {name}</gray>"

# ---------- 处罚系统（punish 包）----------
# 说明：踢下线整屏 / 禁言提示 / 全服广播等「需要高度自定义」的文案在 punish.yml；
#       这里的都是命令执行后的简短反馈。可用占位符：
#       {player} {operator} {reason} {id} {type} {duration} {keyword} {count} {time} {name} {action}
punish:
  warn-received: "<red>你收到了一个警告。</red> <gray>原因：</gray><white>{reason}</white>"
  warn-applied: "<green>已警告 </green><white>{player}</white><green>，编号 </green><yellow>{id}</yellow>"
  kick-applied: "<green>已踢出 </green><white>{player}</white><green>，编号 </green><yellow>{id}</yellow>"
  ban-applied: "<green>已封禁 </green><white>{player}</white><green>（</green><white>{duration}</white><green>），编号 </green><yellow>{id}</yellow>"
  mute-applied: "<green>已禁言 </green><white>{player}</white><green>（</green><white>{duration}</white><green>），编号 </green><yellow>{id}</yellow>"
  unban-applied: "<green>已解封 </green><white>{player}</white><green>，编号 </green><yellow>{id}</yellow>"
  unmute-applied: "<green>已解除禁言 </green><white>{player}</white><green>，编号 </green><yellow>{id}</yellow>"
  # 用法（参数不全时）
  usage-check: "<red>用法：/sfpcheck <处罚ID 或 玩家名></red>"
  usage-warn: "<red>用法：/sfpwarn <在线玩家> <原因></red>"
  usage-kick: "<red>用法：/sfpkick <在线玩家> <原因></red>"
  usage-ban: "<red>用法：/sfpban <玩家> <时间> <原因></red>"
  usage-mute: "<red>用法：/sfpmute <玩家> <时间> <原因></red>"
  usage-unban: "<red>用法：/sfpunban <玩家名></red>"
  usage-unmute: "<red>用法：/sfpunmute <玩家名></red>"
  # 时间写法提示（跟在 ban / mute 用法后面）；{time} 为无法识别的那段输入
  time-format-tip: "<dark_gray>时间示例：7d（7天）、12h、1d2h30m、30m、perm（永久）</dark_gray>"
  bad-time: "<red>时间格式无法识别：</red><white>{time}</white><dark_gray>（示例：7d / 12h / 1d2h30m / perm）</dark_gray>"
  # 解封 / 解禁：目标取自数据库当前名单
  revoke-tip: "<dark_gray>目标来自数据库当前名单，输入时会自动补全。</dark_gray>"
  not-banned: "<yellow>{player} 当前没有被封禁。</yellow>"
  not-muted: "<yellow>{player} 当前没有被禁言。</yellow>"
  # 目标解析失败
  offline: "<red>玩家 </red><white>{player}</white><red> 不在线。</red>"
  unknown-player: "<red>找不到玩家 </red><white>{player}</white><red>（需该玩家至少进过一次服务器）。</red>"
  # 查询结果
  no-record: "<gray>没有找到与 </gray><white>{keyword}</white><gray> 相关的处罚记录。</gray>"
  no-active-punishment: "<green>该玩家当前状态：无处罚。</green>"
  check-header: "<dark_gray>========== 处罚记录：</dark_gray><white>{keyword}</white><dark_gray> ==========</dark_gray>"
  check-footer: "<dark_gray>共 {count} 条记录。</dark_gray>"
  check-active-none: "<gray>当前生效处罚：</gray><green>无处罚</green>"
  check-active-entry: "<gray>当前生效处罚：</gray><red>{type}</red><gray> </gray><white>{duration}</white><gray>（编号 </gray><yellow>{id}</yellow><gray>）</gray>"
  # 单条历史记录：{time} 处罚时间 {type} 类型 {action} 动作 {id} 编号 {operator} 操作者 {reason} 原因
